name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste email content, email addresses, tokens, cookies or sign-in codes. Report security vulnerabilities privately through the repository's Security tab instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Enclave service
        - Verification (scripts/verify.sh, pkg/attestation)
        - Reproducible build (Nix, enclave image)
        - Web app
        - Public site (permaily.com)
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit.
      placeholder: v0.1.0
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the commands you ran and their output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and architecture, browser, Nix version, or whatever applies.
